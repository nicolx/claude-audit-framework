name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    name: Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check framework consistency
        run: bash scripts/check-consistency.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck scripts/*.sh

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.42.0
      - name: Lint documents
        run: markdownlint --config .markdownlint.json '**/*.md'

  install-cycle:
    name: Install / uninstall cycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: framework
      - name: Install into a fresh project, twice, then uninstall
        run: bash framework/scripts/test-install-cycle.sh "$GITHUB_WORKSPACE/framework"
