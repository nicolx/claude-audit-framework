name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    name: Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Check framework consistency
        run: bash scripts/check-consistency.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned: apt's shellcheck drifts, and different versions report different
      # codes for the same code — which is how a run went red on findings that
      # were green locally.
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin shellcheck-v0.11.0/shellcheck
          shellcheck --version
      - name: Lint scripts
        run: shellcheck scripts/*.sh templates/hooks/*.sh

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.42.0
      - name: Lint documents
        run: markdownlint --config .markdownlint.json '**/*.md'

  install-cycle:
    name: Install / uninstall cycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: framework
      - name: Install into a fresh project, twice, then uninstall
        run: bash framework/scripts/test-install-cycle.sh "$GITHUB_WORKSPACE/framework"
